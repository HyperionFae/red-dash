name: Build

# Every push / PR builds the Linux packages (downloadable from the run's
# artifacts). Publishing a GitHub release also attaches them to the release.
on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # older Ubuntu = older glibc, so the AppImage runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: red-dash-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage dist/*.deb --clobber
