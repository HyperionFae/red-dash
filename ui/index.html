<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
  <title>Red Dash</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP: brand · target · vpn · box -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">RED<b>DASH</b></span>
    </div>

    <div class="seg target-seg">
      <span class="seg-label">TARGET</span>
      <input id="in-target" placeholder="10.10.10.5" spellcheck="false">
      <span class="seg-sep">/</span>
      <input id="in-domain" placeholder="lame.htb" spellcheck="false">
      <button id="btn-set-target" class="seg-btn" title="Set target (Enter)">SET</button>
    </div>

    <div class="spacer"></div>

    <button id="vpn-status" class="pill bad" title="Checking VPN…">
      <span class="dot"></span><span class="pill-label">VPN</span><span id="vpn-text">checking</span>
    </button>

    <div class="seg box-seg">
      <span class="seg-label">BOX</span>
      <select id="sel-workspace"></select>
      <button id="btn-new-workspace" class="seg-btn" title="New box">+ NEW</button>
      <button id="btn-delete-workspace" class="seg-btn danger" title="Delete this box">DEL</button>
    </div>

    <button id="btn-reload" class="icon-btn" title="Reload the app (restarts the shell)">⟳</button>
  </header>

  <!-- MIDDLE: examples | terminal | output -->
  <main id="middle">
    <aside id="left" class="panel">
      <div class="panel-head">
        <span class="panel-title">PLAYBOOK</span>
        <span id="ex-count" class="count"></span>
        <span class="spacer"></span>
        <button id="btn-collapse-all" class="mini ghost" title="Collapse / expand all">⇕</button>
        <button id="btn-add-example" class="mini" title="Add your own command">+ ADD</button>
      </div>
      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="ex-filter" placeholder="filter commands" spellcheck="false">
        <kbd>Ctrl⇧K</kbd>
      </div>
      <div id="examples"></div>
    </aside>
    <div class="resizer" data-side="left"></div>

    <section id="center">
      <div id="term-frame">
        <div id="term-header">
          <span class="term-dots"><i></i><i></i><i></i></span>
          <span id="term-title" class="term-title">shell</span>
          <span class="spacer"></span>
          <span id="term-target" class="term-target"></span>
        </div>
        <div id="terminal"></div>
      </div>
    </section>

    <div class="resizer" data-side="right"></div>
    <aside id="right" class="panel">
      <div class="panel-head tabs-head">
        <span class="tabs">
          <button id="tab-output" class="tab active">OUTPUT</button>
          <button id="tab-notes" class="tab">NOTES</button>
          <button id="tab-loot" class="tab">LOOT</button>
        </span>
        <span class="spacer"></span>
        <span id="note-saved-msg" class="saved hidden">saved</span>
        <button id="btn-refresh-output" class="mini ghost" title="Refresh">⟳</button>
      </div>

      <div id="output-pane">
        <div id="output-list"></div>
        <div id="output-view-head" class="hidden">
          <span id="output-view-name"></span>
          <span class="spacer"></span>
          <button id="btn-raw-toggle" class="mini ghost hidden">RAW</button>
        </div>
        <div id="output-view"><div class="empty">Pick a file above to read it.</div></div>
      </div>

      <textarea id="notes-view" class="hidden note-editor" spellcheck="false" placeholder="Notes for this box…  (autosaves · Ctrl+S)"></textarea>
      <textarea id="loot-view" class="hidden note-editor" spellcheck="false" placeholder="Creds, hashes, flags…  (autosaves · Ctrl+S)"></textarea>
    </aside>
  </main>

  <!-- BOTTOM: status bar -->
  <footer id="statusbar">
    <div id="setup-wrap">
      <button id="btn-setup-toggle" class="sb-item">
        <span class="dot"></span><span id="setup-toggle-label">setup</span>
      </button>
      <div id="setup-dropdown" class="hidden">
        <div class="setup-dropdown-head">
          <span class="panel-title">SETUP</span>
          <span class="spacer"></span>
          <button id="btn-undismiss" class="mini ghost hidden">Show dismissed</button>
          <button id="btn-recheck" class="mini ghost">Re-check</button>
        </div>
        <div id="chips"></div>
        <div id="hint-bar" class="hidden">
          <code id="hint-text"></code>
          <div class="hint-buttons">
            <button id="hint-copy" class="mini">Copy</button>
            <button id="hint-close" class="mini ghost">Close</button>
          </div>
        </div>
      </div>
    </div>
    <span class="sb-sep"></span>
    <span id="sb-seclists" class="sb-item"></span>
    <span class="sb-sep"></span>
    <span id="sb-files" class="sb-item"></span>
    <span class="spacer"></span>
    <span class="sb-item faint">click a command → it lands in the shell, you press Enter</span>
    <span class="sb-sep"></span>
    <span id="sb-version" class="sb-item faint"></span>
  </footer>

  <!-- New-box popup -->
  <div id="modal-newbox" class="modal hidden">
    <div class="modal-box">
      <h3>New box</h3>
      <label>Name</label>
      <input id="newbox-name" placeholder="htb-lame" spellcheck="false">
      <div class="modal-buttons">
        <button id="newbox-cancel" class="ghost">Cancel</button>
        <button id="newbox-create">Create</button>
      </div>
    </div>
  </div>

  <!-- Delete-box confirm popup -->
  <div id="modal-delete" class="modal hidden">
    <div class="modal-box">
      <h3>Delete this box?</h3>
      <p id="delete-warning" class="dim"></p>
      <div class="modal-buttons">
        <button id="delete-cancel" class="ghost">Cancel</button>
        <button id="delete-confirm" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Add-example popup -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>Add your own command</h3>
      <div class="row2">
        <div>
          <label>Tool</label>
          <input id="ex-tool" placeholder="nmap" spellcheck="false">
        </div>
        <div>
          <label>Name</label>
          <input id="ex-name" placeholder="Short label" spellcheck="false">
        </div>
      </div>
      <label>Command</label>
      <input id="ex-cmd" placeholder="nmap -sV -oA {OUT}/nmap/x {TARGET}" spellcheck="false">
      <div class="var-hint">{TARGET} {DOMAIN} {OUT} {WORDLIST} {SUBLIST} {PORTS}</div>
      <label>Note <span class="faint">(optional)</span></label>
      <input id="ex-note" spellcheck="false">
      <div class="modal-buttons">
        <button id="ex-cancel" class="ghost">Cancel</button>
        <button id="ex-save">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
